<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#10131D"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A33"/>
      <stop offset="100%" stop-color="#3FE0D0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="220" fill="url(#bg)"/>
  <!-- headset -->
  <g transform="translate(60,45)">
    <rect x="0" y="30" width="160" height="90" rx="28" fill="#1B2030" stroke="#3FE0D0" stroke-width="3"/>
    <circle cx="48" cy="75" r="26" fill="#05070D" stroke="#FF7A33" stroke-width="3"/>
    <circle cx="112" cy="75" r="26" fill="#05070D" stroke="#FF7A33" stroke-width="3"/>
    <rect x="-22" y="55" width="22" height="40" rx="8" fill="#1B2030" stroke="#3FE0D0" stroke-width="3"/>
    <rect x="160" y="55" width="22" height="40" rx="8" fill="#1B2030" stroke="#3FE0D0" stroke-width="3"/>
  </g>
  <!-- broadcast waves -->
  <g transform="translate(250,90)" fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round">
    <path d="M0,30 Q20,0 40,30"/>
    <path d="M-12,42 Q20,-10 52,42" opacity="0.6"/>
    <path d="M-24,54 Q20,-20 64,54" opacity="0.35"/>
  </g>
  <text x="330" y="105" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#F2F4F8">QuasarCast</text>
  <text x="332" y="140" font-family="Arial, sans-serif" font-size="20" fill="#A3AAB8">Экранный каст с Quest 3S без Meta Casting Service</text>
</svg>
